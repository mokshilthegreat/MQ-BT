<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Max-Width Responsive Project</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f4f4;
}

.container{
    width:90%;
    margin:auto;
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    padding:30px 0;
}

.box{
    width:calc(25% - 15px); /* Desktop - 4 columns */
    background:#3498db;
    color:white;
    text-align:center;
    padding:40px;
    border-radius:10px;
    font-size:22px;
}

/* Laptop */
@media (max-width:1200px){
    .box{
        width:calc(33.33% - 14px); /* 3 columns */
    }
}

/* Tablet */
@media (max-width:992px){
    .box{
        width:calc(50% - 10px); /* 2 columns */
    }
}

/* Mobile */
@media (max-width:576px){
    .box{
        width:100%; /* 1 column */
    }
}
</style>

</head>
<body>

<div class="container">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
    <div class="box">Box 4</div>
    <div class="box">Box 5</div>
    <div class="box">Box 6</div>
    <div class="box">Box 7</div>
    <div class="box">Box 8</div>
</div>

</body>
</html>
