<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:450px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
    color:#444;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    outline:none;
    font-size:16px;
}

input:focus,
textarea:focus{
    border-color:#007BFF;
}

textarea{
    resize:none;
    height:120px;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    border:none;
    background:#007BFF;
    color:white;
    font-size:18px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}



@media (max-width:768px){

    .container{
        width:90%;
        padding:20px;
    }

    h2{
        font-size:24px;
    }

    input,
    textarea,
    button{
        font-size:15px;
        padding:10px;
    }

}

</style>

</head>
<body>

<div class="container">

    <h2>Contact Form</h2>

    <form>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Phone</label>
        <input type="tel" placeholder="Enter your phone">

        <label>Message</label>
        <textarea placeholder="Write your message"></textarea>

        <button type="submit">Submit</button>

    </form>

</div>

</body>
</html>
